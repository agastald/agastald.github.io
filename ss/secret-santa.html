<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Santa</title>
<link rel="icon" href="secret-santa.ico">
<style>
  details#setup > summary { cursor: pointer; font-weight: 600; font-size: 18px; margin-bottom: .8em; }
  body { font-family: system-ui, sans-serif; max-width: 800px; margin: 1em auto; padding: 0 1em; color: #222; }
  section { border: 1px solid #ccc; border-radius: 8px; padding: 1em; margin-bottom: 1.5em; }
  h2 { margin-top: 0; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 14px; }
  label { display: block; margin: .6em 0 .2em; font-weight: 600; }
  label.check { font-weight: normal; margin: .3em 0; }
  button { margin-top: .6em; padding: .4em 1em; cursor: pointer; }
  .err { color: #b00; white-space: pre-wrap; }
  .warn { color: #a60; white-space: pre-wrap; }
  .hint { color: #666; font-size: 13px; }
  #output { text-wrap: nowrap; }
</style>
</head>
<body>

<!-- Browser version of secret-santa.py: same input file, same draw rules, same output and link format.
     No third-party libraries: Web Crypto for encryption, crypto.getRandomValues for the draw. -->

<!-- Closed after a successful run, so only the output shows; click the title to open it again -->
<details id="setup" open>
<summary>Input and options</summary>

<section>
  <h2>1. Input</h2>
  <label for="input">Input file: one "group user blocked public_key" per line (blocked: - or user1,user2)</label>
  <textarea id="input" rows="12" spellcheck="false" placeholder="gr  name   blocks     key
1   Ana    -          oZ7GzgmU7giG8eu95Vwl55sJFdbtZ9sgGGTOwnFU2xA
1   Bruno  -          mh9UPCq4jU-ns3EDSlnVVQG7COciqhwvs8wJ9yTmLBQ
2   Carla  Ana,Bruno  TtnzJYo5Uzpxpu86tLH_GL5dRdn0HUHTBiS9stbg8h8"></textarea>
  <label for="url">Page URL</label>
  <input type="text" id="url" value="https://agastald.github.io/akeys.html">
  <label for="header">Message header</label>
  <input type="text" id="header" value="🎅 Amigo secreto! Abra o link para ver quem voce tirou:">
  <button id="btnInputLink">Input link</button>
  <p class="hint" id="inputLinkHint">Link to this page with the input above filled in (#i=...).</p>
</section>

<section>
  <h2>2. Options</h2>
  <label class="check"><input type="checkbox" id="dryRun"> Dry run: show the draw, each with its link (placeholder keys allowed)</label>
  <label class="check"><input type="checkbox" id="outOfGroup"> Out of group: nobody gets someone from their own group</label>
  <button id="btnRun">Run</button>
  <p class="hint">Each run is a new random draw. Without dry run, the draw itself is never shown.</p>
</section>

</details>

<section>
  <h2>3. Output</h2>
  <div id="errors" class="err"></div>
  <div id="warnings" class="warn"></div>
  <textarea id="output" rows="24" readonly spellcheck="false"></textarea>
  <button id="btnCopy">Copy</button>
</section>

<script>
const $ = id => document.getElementById(id);
const subtle = crypto.subtle;
const HEADER = 'gr name blocks key';   // optional first line of the input file
const KEY_RE = /^[A-Za-z0-9_-]{43}$/;   // X25519 public key: 32 bytes in base64url without padding

class DrawError extends Error {}

const toB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const fromB64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));

// Unbiased random integer in [0, n), from the browser's cryptographic random generator
function randInt(n) {
  const limit = Math.floor(0x100000000 / n) * n, buf = new Uint32Array(1);
  do crypto.getRandomValues(buf); while (buf[0] >= limit);
  return buf[0] % n;
}

function shuffle(a) {   // Fisher-Yates
  for (let i = a.length - 1; i > 0; i--) {
    const j = randInt(i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// Returns { users: Map user -> key, blocked: Map user -> Set, groups: Map user -> group, warnings: [] }.
// Each line is "group  user  blocked  key"; blocked is "-", one name, or names separated by commas.
// An optional header line "gr  name  blocks  key" is skipped.
// With checkKeys = false (dry run), invalid keys are only warned about, so placeholder keys work.
function readUsers(text, checkKeys) {
  const users = new Map(), blocked = new Map(), groups = new Map(), errors = [], warnings = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    const n = i + 1, line = raw.trim();
    if (!line || line.startsWith('#')) return;
    const fields = line.split(/\s+/);
    if (fields.join(' ').toLowerCase() === HEADER) return;
    if (fields.length !== 4) {
      errors.push(`line ${n}: expected "group user blocked key" (use - for no blocked), got '${line}'`);
      return;
    }
    const [group, user, block, key] = fields;
    if (users.has(user)) {
      errors.push(`line ${n}: duplicate user '${user}'`);
      return;
    }
    if (!KEY_RE.test(key)) {
      const problem = `line ${n}: invalid public key for '${user}' (expected 43 base64url characters)`;
      if (checkKeys) {
        errors.push(problem);
        return;
      }
      warnings.push(`Warning: ${problem}`);
    }
    users.set(user, key);
    groups.set(user, group);
    blocked.set(user, { n, names: new Set(block === '-' ? [] : block.split(',').filter(Boolean)) });
  });
  const seen = new Map();
  for (const [user, key] of users) {
    if (seen.has(key)) errors.push(`'${user}' and '${seen.get(key)}' have the same public key`);
    seen.set(key, user);
  }
  for (const [user, { n, names }] of blocked) {
    const unknown = [...names].filter(x => !users.has(x)).sort();
    if (unknown.length) errors.push(`line ${n}: '${user}' blocks unknown users: ${unknown.join(', ')}`);
  }
  if (errors.length) throw new DrawError(errors.join('\n'));
  if (users.size < 2) throw new DrawError('need at least 2 users');
  const blockedNames = new Map([...blocked].filter(([, b]) => b.names.size).map(([u, b]) => [u, b.names]));
  return { users, blocked: blockedNames, groups, warnings };
}

// Out of group: nobody gives to someone in their own group (e.g. husband and wife)
function addGroupExclusions(blocked, groups) {
  const out = new Map();
  for (const [g, gg] of groups) {
    const set = new Set(blocked.get(g) || []);
    for (const [r, rg] of groups) if (rg === gg && r !== g) set.add(r);
    out.set(g, set);
  }
  return out;
}

const allowed = (giver, receiver, exclusions) => giver !== receiver && !(exclusions.get(giver)?.has(receiver));

// Returns Map giver -> receiver: everyone gives once and receives once, nobody gets themselves or an excluded person
function draw(names, exclusions, attempts = 10000) {
  // Random shuffles first: every valid draw is equally likely
  for (let t = 0; t < attempts; t++) {
    const receivers = shuffle([...names]);
    if (names.every((g, i) => allowed(g, receivers[i], exclusions))) return new Map(names.map((g, i) => [g, receivers[i]]));
  }
  // Tight exclusions: randomized backtracking either finds a draw or proves there is none
  const result = new Map(), taken = new Set();
  const assign = i => {
    if (i === names.length) return true;
    const giver = names[i];
    for (const r of shuffle(names.filter(r => !taken.has(r) && allowed(giver, r, exclusions)))) {
      result.set(giver, r);
      taken.add(r);
      if (assign(i + 1)) return true;
      taken.delete(r);
    }
    return false;
  };
  if (!assign(0)) throw new DrawError('no valid draw exists with these exclusions');
  return result;
}

// Independent check of the final draw before anything is encrypted
function verify(names, pairs, exclusions) {
  const sorted = a => [...a].sort().join('\n');
  if (sorted(pairs.keys()) !== sorted(names)) throw new Error('not everyone is a giver');
  if (sorted(pairs.values()) !== sorted(names)) throw new Error('not everyone is a receiver');
  for (const [g, r] of pairs) {
    if (g === r) throw new Error(`${g} got themselves`);
    if (exclusions.get(g)?.has(r)) throw new Error(`${g} got excluded ${r}`);
  }
}

// Same format as akeys.html: base64url( ephemeralPub[32] | iv[12] | ciphertext+tag ).
// The X25519 shared secret is used directly as the AES-256-GCM key.
async function encrypt(publicKey, text) {
  const recipient = await subtle.importKey('raw', fromB64(publicKey), { name: 'X25519' }, false, []);
  const eph = await subtle.generateKey({ name: 'X25519' }, true, ['deriveKey']);
  const key = await subtle.deriveKey({ name: 'X25519', public: recipient }, eph.privateKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(text)));
  const ephPub = new Uint8Array(await subtle.exportKey('raw', eph.publicKey));
  const out = new Uint8Array(ephPub.length + iv.length + ct.length);
  out.set(ephPub, 0);
  out.set(iv, ephPub.length);
  out.set(ct, ephPub.length + iv.length);
  return toB64(out);
}

const makeLink = async (url, publicKey, receiver) => `${url}#p=${publicKey}&d=${await encrypt(publicKey, receiver)}`;

async function buildMessage(url, header, users, pairs) {
  const lines = [header, ''];
  for (const [giver, key] of users) lines.push(`${giver}: ${await makeLink(url, key, pairs.get(giver))}`);
  return lines.join('\n');
}

// Draw in plain text, plus each giver's link when possible: opening it should show the receiver printed above it.
// Each name shows its group in brackets, so "out of group" can be checked by eye.
async function buildDryRun(url, users, pairs, blocked, groups, outOfGroup) {
  const label = new Map([...pairs.keys()].map(u => [u, `${u} [${groups.get(u)}]`]));
  const width = Math.max(...[...label.values()].map(x => x.length));
  const lines = ['DRY RUN: the draw is shown. This is a new random draw; the real run will draw again.',
                 `Out of group: ${outOfGroup ? 'yes' : 'no'}`, ''];
  for (const [giver, receiver] of pairs) {
    let line = `${label.get(giver).padEnd(width)} -> ${label.get(receiver)}`;
    if (blocked.get(giver)?.size) line = `${line.padEnd(2 * width + 4)}   (blocked: ${[...blocked.get(giver)].sort().join(', ')})`;
    lines.push(line);
    const key = users.get(giver);
    lines.push(KEY_RE.test(key) ? `    ${await makeLink(url, key, receiver)}` : '    (no link: invalid key)');
  }
  return lines.join('\n');
}

async function run() {
  $('errors').textContent = $('warnings').textContent = $('output').value = '';
  const dryRun = $('dryRun').checked, outOfGroup = $('outOfGroup').checked;
  const url = $('url').value.trim(), header = $('header').value;
  saveSettings();
  try {
    if (!subtle) throw new DrawError('Web Crypto is not available: open this page over HTTPS, localhost or as a local file');
    const { users, blocked, groups, warnings } = readUsers($('input').value, !dryRun);
    $('warnings').textContent = warnings.join('\n');
    const exclusions = outOfGroup ? addGroupExclusions(blocked, groups) : blocked;
    if (outOfGroup) {
      // Each member must give to and receive from outsiders, so a group can't be more than half of everyone
      const size = new Map();
      for (const g of groups.values()) size.set(g, (size.get(g) || 0) + 1);
      const big = [...size].filter(([, n]) => n > users.size - n).map(([g]) => g).sort();
      if (big.length) throw new DrawError(`with out of group, no group can have more than half the people; too big: group ${big.join(', ')}`);
    }
    const names = [...users.keys()];
    const pairs = draw(names, exclusions);
    verify(names, pairs, exclusions);
    $('output').value = dryRun ? await buildDryRun(url, users, pairs, blocked, groups, outOfGroup)
                               : await buildMessage(url, header, users, pairs);
    $('setup').open = false;
  } catch (e) {
    $('errors').textContent = 'Error: ' + (e.message || e);
  }
}

// Remember the input and settings in this browser between visits
const FIELDS = ['input', 'url', 'header'], CHECKS = ['dryRun', 'outOfGroup'];
function saveSettings() {
  const data = Object.fromEntries([...FIELDS.map(id => [id, $(id).value]), ...CHECKS.map(id => [id, $(id).checked])]);
  localStorage.setItem('secret-santa', JSON.stringify(data));
}
function loadSettings() {
  const data = JSON.parse(localStorage.getItem('secret-santa') || 'null');
  if (!data) return;
  FIELDS.forEach(id => { if (typeof data[id] === 'string') $(id).value = data[id]; });
  CHECKS.forEach(id => { $(id).checked = !!data[id]; });
}

// #i=<input>: fields joined by "+", lines by ";", each field URL-encoded (smaller than base64: keys are already URL-safe).
// Header, comment and blank lines are left out. The link also carries the options (&o=1 out of group, &dry=1 dry run).
// Opening the link fills in the input, sets the options from the link and runs the draw.
function encodeInput(text) {
  return text.split(/\r?\n/).map(l => l.trim())
    .filter(l => l && !l.startsWith('#') && l.split(/\s+/).join(' ').toLowerCase() !== HEADER)
    .map(l => l.split(/\s+/).map(encodeURIComponent).join('+')).join(';');
}

function inputFromLink() {
  const params = new URLSearchParams(location.hash.slice(1));
  const i = params.get('i');   // decodes %XX and "+" -> space
  if (i === null) return;
  $('input').value = HEADER.replace(/ /g, '  ') + '\n' + i.split(';').join('\n');
  $('outOfGroup').checked = params.get('o') === '1';
  $('dryRun').checked = params.get('dry') === '1';
  run();
}

// On phones/tablets (touchscreen as main input) with the Web Share API: share sheet instead of copy
const useShare = !!navigator.share && matchMedia('(pointer: coarse)').matches;

async function shareOrCopy(text, btn, label) {
  if (useShare) {
    try {
      await navigator.share({ text });
    } catch (e) {
      if (e.name !== 'AbortError') alert('Could not share: ' + e);   // AbortError = user closed the share sheet
    }
    return;
  }
  await navigator.clipboard.writeText(text);
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = label, 1200);
}

async function inputLink() {
  const link = location.href.split('#')[0] + '#i=' + encodeInput($('input').value)
             + ($('outOfGroup').checked ? '&o=1' : '') + ($('dryRun').checked ? '&dry=1' : '');
  const hint = $('inputLinkHint');
  hint.textContent = `${link.length} characters` + (link.length >= 1000 ? ' (over 1000: may be too long for some apps)' : '');
  hint.className = link.length >= 1000 ? 'warn' : 'hint';
  await shareOrCopy(link, $('btnInputLink'), 'Input link');
}

const copyLabel = useShare ? 'Share' : 'Copy';
$('btnCopy').textContent = copyLabel;
$('btnRun').onclick = run;
$('btnCopy').onclick = () => shareOrCopy($('output').value, $('btnCopy'), copyLabel);
$('btnInputLink').onclick = inputLink;
loadSettings();
inputFromLink();
</script>
</body>
</html>
